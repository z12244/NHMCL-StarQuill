name: "✨ 功能建议"
description: "希望启动器新增或改进某个功能"
title: "[建议] 一句话描述需求"
labels: ["建议"]
body:
  - type: markdown
    attributes:
      value: |
        感谢建议！请把「要什么 + 为什么」讲清楚，便于评估优先级。

  - type: textarea
    id: need
    attributes:
      label: "你希望新增 / 改进什么？"
      description: "清晰描述想要的功能或改进点。"
      placeholder: "例如：希望在下载模组时支持按 MC 版本批量筛选……"
    validations:
      required: true

  - type: textarea
    id: scenario
    attributes:
      label: "使用场景"
      description: "在什么情况下会用到？解决了你什么痛点？"
    validations:
      required: false

  - type: textarea
    id: expected
    attributes:
      label: "期望的效果"
      description: "理想中它应该怎样表现 / 交互？"
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: "参考或替代方案"
      description: "现在是怎么绕过去的？有没有别的启动器做了类似功能可以参考？"
    validations:
      required: false
